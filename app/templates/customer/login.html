{% extends "base.html" %}
{% block title %}Sign In - Watchnetic{% endblock %}
{% block content %}
<div class="flex-grow flex items-center justify-center bg-slate-50 py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Background Accents -->
    <div
        class="absolute -top-40 -right-40 w-96 h-96 bg-primary-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30">
    </div>
    <div
        class="absolute -bottom-40 -left-40 w-96 h-96 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30">
    </div>

    <div
        class="max-w-md w-full space-y-8 bg-white p-10 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 relative z-10 transition-all hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)]">
        <div>
            <div
                class="mx-auto h-16 w-16 bg-primary-50 rounded-2xl flex items-center justify-center mb-6 text-primary-600 text-3xl shadow-sm border border-primary-100">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <h2 class="text-center text-3xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h2>
            <p class="mt-2 text-center text-sm text-slate-500 font-medium">Please sign in to your Watchnetic account</p>
        </div>

        <form class="mt-8 space-y-6" action="{{ url_for('customer.customer_login') }}" method="POST">
            <div class="space-y-4 rounded-md shadow-sm">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1 leading-relaxed">Email
                        address</label>
                    <input id="email" name="email" type="email" required
                        class="appearance-none block w-full px-4 py-3.5 border border-slate-200 placeholder-slate-400 text-slate-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm bg-slate-50 transition-colors focus:bg-white"
                        placeholder="name@example.com">
                </div>
                <div>
                    <label for="password"
                        class="block text-sm font-medium text-slate-700 mb-1 leading-relaxed">Password</label>
                    <input id="password" name="password" type="password" required
                        class="appearance-none block w-full px-4 py-3.5 border border-slate-200 placeholder-slate-400 text-slate-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm bg-slate-50 transition-colors focus:bg-white"
                        placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox"
                        class="h-4 w-4 text-primary-600 focus:ring-primary-500 bg-slate-50 border-slate-300 rounded cursor-pointer">
                    <label for="remember-me"
                        class="ml-2 block text-sm font-medium text-slate-600 cursor-pointer">Remember me</label>
                </div>

                <div class="text-sm">
                    <a href="#" class="font-semibold text-primary-600 hover:text-primary-500 transition-colors">Forgot
                        your password?</a>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit"
                    class="group relative w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-primary-600 hover:bg-primary-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-600 shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-4">
                        <i class="fa-solid fa-lock text-primary-400 group-hover:text-primary-300 transition-colors"></i>
                    </span>
                    Sign In Tracking
                </button>
            </div>
        </form>

        <div class="mt-6 border-t border-slate-100 pt-6">
            <p class="text-center text-sm font-medium text-slate-600">
                Don't have an account?
                <a href="{{ url_for('customer.customer_register') }}"
                    class="font-bold text-primary-600 hover:text-primary-500 transition-colors ml-1">Register here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
