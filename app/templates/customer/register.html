{% extends "base.html" %}
{% block title %}Register - Watchnetic{% endblock %}
{% block content %}
<div class="flex-grow flex items-center justify-center bg-slate-50 py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Background Accents -->
    <div
        class="absolute -top-40 -left-40 w-96 h-96 bg-primary-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30">
    </div>
    <div
        class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30">
    </div>

    <div
        class="max-w-lg w-full space-y-8 bg-white p-10 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 relative z-10 transition-all hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)]">
        <div>
            <div
                class="mx-auto h-16 w-16 bg-primary-50 rounded-2xl flex items-center justify-center mb-6 text-primary-600 text-3xl shadow-sm border border-primary-100">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 class="text-center text-3xl font-extrabold text-slate-900 tracking-tight">Create an Account</h2>
            <p class="mt-2 text-center text-sm text-slate-500 font-medium">Join Watchnetic to enjoy exclusive offers and
                fast checkout.</p>
        </div>

        <form class="mt-8 space-y-4" action="{{ url_for('customer.customer_register') }}" method="POST">
            <div>
                <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                <input id="name" name="name" type="text" required
                    class="appearance-none block w-full px-4 py-3.5 border border-slate-200 placeholder-slate-400 text-slate-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm bg-slate-50 transition-colors focus:bg-white"
                    placeholder="John Doe">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email address</label>
                <input id="email" name="email" type="email" required
                    class="appearance-none block w-full px-4 py-3.5 border border-slate-200 placeholder-slate-400 text-slate-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm bg-slate-50 transition-colors focus:bg-white"
                    placeholder="name@example.com">
            </div>

            <div>
                <label for="phone" class="block text-sm font-medium text-slate-700 mb-1">Phone Number</label>
                <input id="phone" name="phone" type="text" required
                    class="appearance-none block w-full px-4 py-3.5 border border-slate-200 placeholder-slate-400 text-slate-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm bg-slate-50 transition-colors focus:bg-white"
                    placeholder="0300 1234567">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input id="password" name="password" type="password" required
                    class="appearance-none block w-full px-4 py-3.5 border border-slate-200 placeholder-slate-400 text-slate-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm bg-slate-50 transition-colors focus:bg-white"
                    placeholder="••••••••">
            </div>

            <div class="pt-4">
                <button type="submit"
                    class="group relative w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-primary-600 hover:bg-primary-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-600 shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5">
                    Register Now
                </button>
            </div>
        </form>

        <div class="mt-6 border-t border-slate-100 pt-6">
            <p class="text-center text-sm font-medium text-slate-600">
                Already have an account?
                <a href="{{ url_for('customer.customer_login') }}"
                    class="font-bold text-primary-600 hover:text-primary-500 transition-colors ml-1">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
